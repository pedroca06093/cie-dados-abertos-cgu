name: Atualizar dados abertos da CGU
on:
  schedule:
    - cron: "17 12 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Baixar arquivos oficiais
        run: node scripts/update.mjs
      - name: Publicar arquivos e manifesto
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view cgu-latest >/dev/null 2>&1; then
            gh release create cgu-latest --title "Dados abertos CEIS e CNEP" --notes "Cópias dos arquivos oficiais da CGU; confira a data e o SHA-256 no manifest.json."
          fi
          gh release upload cgu-latest out/ceis.zip out/cnep.zip --clobber
          cp out/manifest.json manifest.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          if ! git diff --cached --quiet; then
            git commit -m "Atualizar arquivos CEIS e CNEP"
            git push
          fi
